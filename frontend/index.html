<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Todo App - SPA</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>To‑Do</h1>

    <form id="task-form" class="card">
      <label>
        Title
        <input type="text" id="title" required maxlength="255" />
      </label>
      <label>
        Description
        <textarea id="description"></textarea>
      </label>
      <button type="submit" id="add-btn">Add Task</button>
    </form>

    <section>
      <h2>Recent tasks</h2>
      <div id="tasks" class="grid"></div>
    </section>
  </main>

<script src="app.js"></script>
</body>
</html>
